# 入口反代 nginx — Cloudflare 后置模式
#
# TLS 由 Cloudflare 终结（Flexible/Full SSL）：CF → origin 用 HTTP 80。
# Origin 不需要 443 + 证书。如果以后想 Full (Strict)，再加 443 + Cloudflare Origin CA。
#
# 路由：
#   主域 app-falconx.lifebyteapp.dev   → 客户端 + gateway 业务 API/WS
#   子域 admin-falconx.lifebyteapp.dev → 管理端 SPA + console API（Accept 分流）

upstream client_frontend { server client-frontend:80; }
upstream admin_frontend  { server admin-frontend:80; }
upstream gateway_api     { server gateway:18080; }
upstream console_api     { server console-service:18085; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 把 Cloudflare 提供的 CF-Connecting-IP 转成 gateway 期望的 X-Client-Ip
# 没经过 CF 时 fallback 到 $remote_addr
map $http_cf_connecting_ip $client_ip_for_gateway {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# admin 子域：用 Accept header 区分 SPA 导航 vs API（沿用 vite dev bypass 思路）
#   - text/html → admin-frontend（SPA fallback 到 index.html）
#   - 其他       → console-service（API）
map $http_accept $admin_route_target {
    default          console_api;
    ~*text/html      admin_frontend;
}

server {
    listen 80;
    server_name app-falconx.lifebyteapp.dev;
    client_max_body_size 10m;

    # 业务 REST
    location /api/v1/ {
        proxy_pass http://gateway_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Ip $client_ip_for_gateway;
        proxy_read_timeout 60s;
    }

    # WebSocket（行情 / 交易）
    location /ws/v1/ {
        proxy_pass http://gateway_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Ip $client_ip_for_gateway;
        proxy_read_timeout 86400s;
    }

    # 客户端 SPA + 静态资源
    location / {
        proxy_pass http://client_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin-falconx.lifebyteapp.dev;
    client_max_body_size 10m;

    # /admin/* 用 Accept 分流
    location /admin/ {
        proxy_pass http://$admin_route_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Ip $client_ip_for_gateway;
        proxy_read_timeout 60s;
    }

    # admin WebSocket（admin 实时推送也经 gateway）
    location /ws/v1/ {
        proxy_pass http://gateway_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Ip $client_ip_for_gateway;
        proxy_read_timeout 86400s;
    }

    # 其余（SPA 入口 / 静态资源 / /admin 无 trailing slash）→ admin-frontend
    location / {
        proxy_pass http://admin_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 兜底（直连 IP 或未匹配域名）：返回客户端首页
server {
    listen 80 default_server;
    server_name _;
    location / {
        proxy_pass http://client_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
