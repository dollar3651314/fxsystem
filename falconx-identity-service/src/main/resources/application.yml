spring:
  # 2026-05-27 Sprint 6 顺序5：JDK 25 + Spring Boot 4 虚拟线程（Tomcat 请求 + @Async + @Scheduled）。
  # JEP 491 已解决 synchronized pinning；自定义线程池（分区 executor/dispatcher/扫块 poller）不受影响仍用平台线程。
  threads:
    virtual:
      enabled: true
  application:
    name: falconx-identity-service
  datasource:
    url: jdbc:mysql://localhost:3306/falconx_identity?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${FALCONX_IDENTITY_DB_USERNAME}
    password: ${FALCONX_IDENTITY_DB_PASSWORD}
    hikari:
      # STAGE-12 perf：默认 HikariCP idleTimeout/maxLifetime 不主动 evict，
      # 实测 MySQL processlist 多条 Sleep>16000s（4-7h）。显式收紧到 10min/30min。
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      keepalive-time: 300000
  data:
    redis:
      host: ${FALCONX_REDIS_HOST:localhost}
      port: ${FALCONX_REDIS_PORT:6380}
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      missing-topics-fatal: false
    consumer:
      # 2026-05-26 Sprint 5 A2：latest → earliest，inbox 幂等下重复消费安全
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 注册成功后预分配地址必须严格 ack，避免漏发漏分配
      acks: all
      retries: 5
      # 2026-05-26 Sprint 5 A1：批量 + 压缩
      batch-size: 16384
      properties:
        enable.idempotence: true
        linger.ms: 10
        compression.type: lz4
  flyway:
    enabled: true
    locations: classpath:db/migration
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml

server:
  port: 18081

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level --- [%15.15t] [traceId=%X{traceId:-}] %logger{39} : %msg%n%ex"

falconx:
  identity:
    kafka:
      deposit-credited-topic: falconx.trading.deposit.credited
      consumer-group-id: falconx.identity-service.deposit-credited-consumer-group
      user-registered-topic: falconx.identity.user.registered
    token:
      issuer: falconx-identity-service
      access-token-ttl: 15m
      refresh-token-ttl: 72h
    password:
      bcrypt-strength: 12
    security:
      login-failure-limit: 5
      login-lock-duration: 15m
      register-limit: 5
      register-window: 1h
    key-pair:
      private-key-pem: ${FALCONX_IDENTITY_PRIVATE_KEY_PEM}
      public-key-pem: ${FALCONX_IDENTITY_PUBLIC_KEY_PEM}
    # STAGE-2-CUSTOMER 内部 RPC 鉴权 token：gateway 注入 X-Internal-Token，identity filter 校验
    # dev/test 默认值；prod/staging 必须通过 FALCONX_INTERNAL_API_TOKEN 环境变量覆盖
    internal-api:
      token: ${FALCONX_INTERNAL_API_TOKEN:falconx-internal-dev-token}

# STAGE-11-OBS-RECON §14.5 actuator endpoints（运维 / canary / k8s probe 用，不暴露给前端）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,prometheus,threaddump,heapdump
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    loggers:
      enabled: true
  info:
    git:
      mode: simple
    build:
      enabled: true
