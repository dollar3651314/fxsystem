spring:
  data:
    redis:
      host: localhost
      port: ${FALCONX_REDIS_PORT:6380}

resilience4j:
  timelimiter:
    instances:
      identity-route:
        timeout-duration: 10s
      # dev：market /api/v1/market/symbols 单次返回 1571 行 / 626 KB，DB+ClickHouse 现实 9-12s；
      # 调到 30s 让 dev 链路能用；技术债：market 加 Redis/Caffeine 缓存（symbols 列表静态 + last_tick 单独 ZSET）
      market-route:
        timeout-duration: 30s
      trading-route:
        timeout-duration: 10s
      wallet-route:
        timeout-duration: 10s

