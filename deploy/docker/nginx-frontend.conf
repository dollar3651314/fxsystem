# 前端容器内 nginx：SPA fallback + gzip
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # 带 hash 的静态资源：内容不变可永久缓存（Vite 生成 hash 文件名，content-addressed）
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # STAGE-13 fix：index.html 不能缓存 —— 每次部署文件名不变但内容变化
    # （引用了新 hash 的 JS bundle）。若浏览器缓存了旧 index.html，新部署后会继续请求
    # 404 的旧 hash chunk，整个页面打不开（白屏 / 资源 not found）。
    # 用 no-store 强制每次回源拿最新 HTML，再由它加载新 hash 文件名的 chunk。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    # SPA fallback —— 任何未匹配路径都返回 index.html（前端路由由 React 处理）
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
