# Grafana 仪表盘 provisioning：自动加载 /var/lib/grafana/dashboards 下的 JSON。
apiVersion: 1
providers:
  - name: falconx
    orgId: 1
    folder: FalconX
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
